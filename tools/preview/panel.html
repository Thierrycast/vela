<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vela — painel (review)</title>
    <style>
      /* O painel é uma barra lateral do Chrome, nunca uma página inteira. Sem esta moldura
         o review julgaria proporções que o produto não tem. Largura ajustável por ?largura=. */
      html, body { margin: 0; height: 100%; }
      /* Centralizado: encostado numa borda, o painel some do recorte quando a ferramenta
         de review captura um viewport mais estreito que o da janela. */
      body { display: flex; justify-content: center; }
      #root {
        width: var(--largura-do-painel, 380px);
        max-width: 100%;
        height: 100vh;
        border-left: 1px solid #252c30;
        border-right: 1px solid #252c30;
        overflow: hidden;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
